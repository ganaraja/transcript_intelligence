[project]
name = "transcript-intelligence-backend"
version = "0.1.0"
description = "Transcript Intelligence pipeline and FastAPI server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.54.0",
]
embeddings = [
    "sentence-transformers>=3.3.0",
    "scikit-learn>=1.5.0",
]
notebook = [
    "ipykernel>=6.29.0",
]

[project.scripts]
transcript-pipeline = "pipeline.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.uv]
package = true
