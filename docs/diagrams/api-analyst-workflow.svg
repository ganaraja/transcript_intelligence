<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-gray-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M11 1L1 6L11 11Z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 750; letter-spacing: 2.2px; }
      .title { font-size: 34px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #475569; }
      .card-title { font-size: 21px; font-weight: 740; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .step { font-size: 13px; font-weight: 760; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .chip { font-size: 13px; font-weight: 650; fill: #334155; }
    </style>
  </defs>
  <rect width="1600" height="1320" fill="#f8fafc"/>
  <text x="100" y="76" class="eyebrow" fill="#be123c">04 · SERVING &amp; ANALYST EXPERIENCE</text>
  <text x="100" y="126" class="title">Insights stay explainable from API to analyst</text>
  <text x="100" y="160" class="subtitle">The backend serves persisted results; the dashboard handles navigation, filtering, and local review workflow.</text>

  <!-- Primary flow arrows -->
  <path d="M800 316V356M800 542V582M800 736V776M800 1015V1055" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="120" y="190" width="1360" height="126" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="177" cy="253" r="24" fill="#d97706"/>
  <text x="177" y="254" class="step">01</text>
  <text x="225" y="245" class="card-title">PROCESSED ARTIFACTS</text>
  <text x="225" y="278" class="body">data/processed/ · meeting records · themes · sentiment · risk · graph · VOC · provenance</text>
  <g transform="translate(1190 228)">
    <rect width="220" height="52" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="110" y="32" class="chip" text-anchor="middle">Batch-generated JSON</text>
  </g>

  <!-- API -->
  <rect x="120" y="356" width="1360" height="186" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="177" cy="411" r="24" fill="#0f766e"/>
  <text x="177" y="412" class="step">02</text>
  <text x="225" y="418" class="card-title">FASTAPI SERVICE · app/main.py</text>
  <text x="225" y="450" class="body">GET /api/* reads persisted artifacts · meeting detail is served by meeting ID.</text>
  <text x="225" y="479" class="small">Overview · meetings · themes · taxonomy validation · sentiment · risk · graph · VOC · provenance</text>
  <rect x="225" y="496" width="378" height="30" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="414" y="516" class="small" text-anchor="middle">POST /api/reprocess is explicit</text>
  <path d="M1425 400H1510V250H1485" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-pink)"/>
  <rect x="1386" y="328" width="170" height="28" rx="9" fill="#fff1f2"/>
  <text x="1471" y="348" class="small" text-anchor="middle" fill="#9f1239">regenerates files</text>

  <!-- Client -->
  <rect x="120" y="582" width="1360" height="154" rx="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="177" cy="659" r="24" fill="#e11d48"/>
  <text x="177" y="660" class="step">03</text>
  <text x="225" y="648" class="card-title">REACT CLIENT · src/api.ts</text>
  <text x="225" y="681" class="body">TanStack Query loads API responses; shared filters travel as URL query parameters.</text>
  <g transform="translate(1090 620)">
    <rect width="320" height="76" rx="14" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="160" y="31" class="chip" text-anchor="middle">Filter state is shareable</text>
    <text x="160" y="55" class="small" text-anchor="middle">Preserved across drill-ins</text>
  </g>

  <!-- Views -->
  <rect x="120" y="776" width="820" height="239" rx="20" fill="#ffe4e6" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="177" cy="831" r="24" fill="#e11d48"/>
  <text x="177" y="832" class="step">04</text>
  <text x="225" y="838" class="card-title">DASHBOARD VIEWS</text>
  <text x="225" y="873" class="body">Overview · Themes · Sentiment · Risk Radar · Issue Graph</text>
  <text x="225" y="903" class="body">Account detail · Meeting detail · Review Queue</text>
  <line x1="225" y1="925" x2="900" y2="925" stroke="#fecdd3" stroke-width="2"/>
  <text x="225" y="955" class="small">Review queue prioritizes high-risk, low-confidence, and weak-theme-evidence records.</text>
  <text x="225" y="982" class="small">Meeting detail exposes computed values, rationale, and supporting evidence.</text>

  <!-- Browser storage -->
  <rect x="1060" y="776" width="420" height="239" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092" y="823" class="card-title">BROWSER localStorage</text>
  <text x="1092" y="859" class="body">Low-sample threshold</text>
  <text x="1092" y="891" class="body">Review status · mark / reopen</text>
  <line x1="1092" y1="913" x2="1448" y2="913" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1092" y="945" class="small">Local to this browser</text>
  <text x="1092" y="971" class="small">Not shared across analysts</text>
  <path d="M940 876H1052" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M1052 923H940" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="948" y="946" width="96" height="26" rx="8" fill="#f8fafc"/>
  <text x="996" y="964" class="small" text-anchor="middle">browser state</text>

  <!-- Analysts -->
  <rect x="120" y="1055" width="1360" height="142" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="177" cy="1126" r="24" fill="#475569"/>
  <text x="177" y="1127" class="step">05</text>
  <text x="225" y="1112" class="card-title">ANALYSTS</text>
  <text x="225" y="1147" class="body">Product · Support · Sales · Engineering</text>
  <text x="225" y="1175" class="small">Investigate evidence, coordinate follow-up, and share filtered views by URL.</text>
  <g transform="translate(1190 1080)">
    <rect width="220" height="64" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="110" y="28" class="chip" text-anchor="middle">Read-only analysis</text>
    <text x="110" y="49" class="small" text-anchor="middle">Local review workflow</text>
  </g>

  <text x="120" y="1250" class="small">Analysis is not executed in the browser. Refresh or reprocess artifacts explicitly when the source dataset changes.</text>
</svg>
