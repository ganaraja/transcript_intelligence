<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-violet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#8b5cf6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 750; letter-spacing: 2.2px; }
      .title { font-size: 34px; font-weight: 760; }
      .subtitle { font-size: 17px; fill: #475569; }
      .card-title { font-size: 21px; font-weight: 740; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .step { font-size: 13px; font-weight: 760; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .tag { font-size: 13px; font-weight: 700; fill: #115e59; }
    </style>
  </defs>
  <rect width="1600" height="1480" fill="#f8fafc"/>
  <text x="100" y="76" class="eyebrow" fill="#0f766e">02 · OFFLINE ANALYSIS</text>
  <text x="100" y="126" class="title">An explainable batch pipeline</text>
  <text x="100" y="160" class="subtitle">Each meeting is enriched once, then validated and aggregated into stable artifacts.</text>

  <!-- Primary flow connector spine -->
  <path d="M800 316V354M800 492V530M800 720V762M800 940V980M800 1128V1168" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Input -->
  <rect x="160" y="200" width="1280" height="116" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="258" r="24" fill="#3b82f6"/>
  <text x="216" y="259" class="step">01</text>
  <text x="262" y="250" class="card-title">MEETING FILES</text>
  <text x="262" y="281" class="body">Metadata · transcript · summary · speaker information</text>
  <g transform="translate(1135 235)">
    <rect width="245" height="48" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="122" y="30" class="small" text-anchor="middle">One folder per meeting</text>
  </g>

  <!-- Ingest -->
  <rect x="160" y="354" width="1280" height="138" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="423" r="24" fill="#0f766e"/>
  <text x="216" y="424" class="step">02</text>
  <text x="262" y="411" class="card-title">INGEST &amp; NORMALIZE</text>
  <text x="262" y="442" class="body">pipeline/ingest.py · joins available inputs into a normalized RawMeeting</text>
  <text x="262" y="468" class="small">Missing optional files are tolerated; unused source files are not treated as evidence.</text>

  <!-- Per-meeting enrichment -->
  <rect x="160" y="530" width="1280" height="190" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="585" r="24" fill="#0f766e"/>
  <text x="216" y="586" class="step">03</text>
  <text x="262" y="592" class="card-title">PER-MEETING ENRICHMENT</text>
  <text x="262" y="625" class="small">sentiment.py · classify.py · explainable deterministic baseline</text>
  <g transform="translate(262 650)">
    <rect width="228" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="114" y="27" class="tag" text-anchor="middle">Speaker-side sentiment</text>
    <rect x="242" width="180" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="332" y="27" class="tag" text-anchor="middle">Call type</text>
    <rect x="436" width="170" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="521" y="27" class="tag" text-anchor="middle">Modules + themes</text>
    <rect x="620" width="166" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="703" y="27" class="tag" text-anchor="middle">Risk signals</text>
    <rect x="800" width="322" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="961" y="27" class="tag" text-anchor="middle">Evidence + confidence · MeetingRecord</text>
  </g>

  <!-- Optional lane -->
  <rect x="1080" y="742" width="360" height="200" rx="20" fill="#ede9fe" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
  <text x="1110" y="785" class="card-title" fill="#4c1d95">OPTIONAL ENRICHMENT</text>
  <text x="1110" y="817" class="body">OpenAI theme refinement</text>
  <text x="1110" y="843" class="small">pipeline/llm.py · configured only</text>
  <rect x="1110" y="866" width="300" height="52" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1260" y="888" class="small" text-anchor="middle">Cached per-meeting response</text>
  <text x="1260" y="907" class="small" text-anchor="middle">data/cache/llm/</text>
  <path d="M1175 720V737" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <path d="M1080 849H1002V852H800V762" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-violet)"/>
  <rect x="846" y="738" width="210" height="28" rx="10" fill="#f8fafc"/>
  <text x="951" y="757" class="small" text-anchor="middle" fill="#6d28d9">refined theme fields</text>

  <!-- Validation -->
  <rect x="160" y="762" width="840" height="178" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="817" r="24" fill="#0f766e"/>
  <text x="216" y="818" class="step">04</text>
  <text x="262" y="824" class="card-title">VALIDATE TAXONOMY EVIDENCE</text>
  <text x="262" y="858" class="body">Check title, summary, provided topics, and quote support.</text>
  <text x="262" y="887" class="small">Report pass rate, representative examples, and records needing human review.</text>
  <rect x="262" y="901" width="380" height="25" rx="10" fill="#f0fdfa"/>
  <text x="274" y="919" class="small">Operational review cues · not calibrated probabilities</text>

  <!-- Aggregation -->
  <rect x="160" y="980" width="1280" height="148" rx="20" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="1054" r="24" fill="#0f766e"/>
  <text x="216" y="1055" class="step">05</text>
  <text x="262" y="1043" class="card-title">AGGREGATE INSIGHTS</text>
  <text x="262" y="1075" class="body">Themes &amp; examples · sentiment trends &amp; heatmap · risk radar · issue graph</text>
  <text x="262" y="1102" class="body">VOC backlog · overview KPIs · interpretation takeaways</text>
  <g transform="translate(1190 1019)">
    <rect width="190" height="66" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="95" y="28" class="tag" text-anchor="middle">Aggregate once</text>
    <text x="95" y="50" class="small" text-anchor="middle">Read many times</text>
  </g>

  <!-- Write outputs -->
  <rect x="160" y="1168" width="1280" height="150" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="216" cy="1243" r="24" fill="#d97706"/>
  <text x="216" y="1244" class="step">06</text>
  <text x="262" y="1232" class="card-title">PERSIST REUSABLE ARTIFACTS</text>
  <text x="262" y="1264" class="body">Ten JSON files in data/processed/ · meeting records and insight summaries</text>
  <text x="262" y="1293" class="small">run_manifest.json records code, input-data, and configuration provenance.</text>
  <g transform="translate(1190 1208)">
    <rect width="190" height="66" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="95" y="28" class="small" text-anchor="middle">File-backed</text>
    <text x="95" y="50" class="small" text-anchor="middle">No database</text>
  </g>

  <text x="160" y="1385" class="small">The deterministic path always runs. OpenAI refinement is optional and its result is rechecked against taxonomy evidence.</text>
</svg>
